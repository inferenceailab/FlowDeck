# FlowDeck, as the homelab runs it.
#
#     docker compose pull && docker compose up -d
#
# Images come from GHCR, built and pushed by CD. Nothing is built here: a
# deployment that compiled from source would deploy whatever the box happened
# to have checked out rather than the artefact CI verified.

name: flowdeck

services:
  api:
    image: ${IMAGE_PREFIX:-ghcr.io/inferenceailab/flowdeck}/api:${IMAGE_TAG:-latest}
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Production

      # Identifies this node while it holds a lease (ADR-0023). Defaults to
      # machine:process, which is correct but opaque in a container where the
      # machine name is a container id. Naming it makes the dashboard's
      # "Running on" field mean something to an operator.
      FlowDeck__Cluster__NodeId: ${NODE_ID:-homelab}

    # Readiness, not liveness. A node whose store is unreachable is running
    # correctly and cannot serve, so it should leave rotation rather than be
    # restarted - restarting it during a database outage produces a restart
    # loop and makes recovery harder.
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:8080/health/ready']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

    expose:
      - '8080'

  web:
    image: ${IMAGE_PREFIX:-ghcr.io/inferenceailab/flowdeck}/web:${IMAGE_TAG:-latest}
    restart: unless-stopped

    ports:
      - '${WEB_PORT:-8080}:80'

    # Only ordering, not readiness: nginx proxies /api and will simply return
    # 502 until the API answers. Waiting for healthy would mean the dashboard
    # is unreachable during an API outage, when it is the thing an operator
    # would use to find out what is wrong.
    depends_on:
      - api
