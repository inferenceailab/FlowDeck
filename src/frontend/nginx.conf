server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The dashboard fetches relative URLs - /api/instances, not an absolute
    # host - so that the same bundle works in development, in a container, and
    # behind whatever hostname the homelab uses. Nothing is baked in at build
    # time, which means nothing has to be rebuilt to move it.
    #
    # The cost is that this proxy has to exist: without it those relative
    # requests hit nginx and 404.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A workflow can suspend for a long time, but an HTTP call about one
        # should not. This is a control plane, not the execution path.
        proxy_read_timeout 60s;
    }

    # The OpenAPI document, so a client can fetch the contract from the same
    # origin it calls.
    location /openapi/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Hashed build output never changes under the same name, so it can be
    # cached indefinitely.
    location ~* \.(?:js|css|woff2?|png|svg|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must not be cached, or a browser keeps loading the old one and
    # asking for asset hashes that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # A single-page application owns its own routes. /instances/3f2a… is a real
    # page to Angular and a missing file to nginx, so anything unmatched falls
    # back to the shell rather than 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Not a security boundary - the API is the authority - but there is no
    # reason to advertise the server version.
    server_tokens off;
}
