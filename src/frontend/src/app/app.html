<!--
  The application shell: a skip link, a banner with navigation, and the routed
  view.

  Deliberately semantic. header/nav/main are landmarks a screen reader can jump
  between; a div-based layout would not be (ADR-0016). User-visible text carries
  i18n attributes even though only English ships (ADR-0017).
-->
<a class="skip-link" href="#main-content" i18n>Skip to main content</a>

<header class="shell-header">
  <div class="shell-brand">
    <span class="shell-logo" aria-hidden="true">&#9656;</span>
    <span class="shell-title" i18n>FlowDeck</span>
  </div>

  <nav i18n-aria-label aria-label="Primary">
    <ul class="shell-nav">
      @for (item of navigation; track item.path) {
        <li>
          <a
            [routerLink]="item.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.exact }"
            #link="routerLinkActive"
            [attr.aria-current]="link.isActive ? 'page' : null"
            >{{ item.label }}</a
          >
        </li>
      }
    </ul>
  </nav>
</header>

<!--
  tabindex="-1" so the skip link can move focus here. Without it the link
  scrolls the page but leaves focus in the header, which helps sighted mouse
  users and nobody else.
-->
<main id="main-content" tabindex="-1">
  <router-outlet />
</main>
