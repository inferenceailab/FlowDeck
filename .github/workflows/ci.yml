name: CI

# Runs on every pull request into main, and on main itself after merge.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# The repository default is read-only; each job narrows further where it can.
permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

# GitHub-hosted runners, not self-hosted. CI needs nothing from the homelab,
# and a self-hosted CI produced zero verification in the weeks it was queued.
#
# It is also the safer half of the split: a self-hosted runner on a public
# repository will happily execute a fork's pull request. CD is the only
# self-hosted workflow here, and it never triggers on `pull_request`.
jobs:
  # --------------------------------------------------------------- backend
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest

    # A real PostgreSQL, because the store conformance suite has only ever run
    # against SQLite and the deployment target is Postgres (#78). The two do not
    # behave identically - SQLite refused to ORDER BY a DateTimeOffset at all,
    # found by accident in #17.
    #
    # A runner service rather than Testcontainers: GitHub hosts this
    # declaratively, so verifying the real target costs no package and leaves
    # ADR-0010 alone. The suite still skips these when the variable is absent,
    # so `dotnet test` on a laptop needs no database.
    services:
      postgres:
        image: postgres:17-alpine@sha256:6f30057d31f5861b66f3545d4821f987aacf1dd920765f0acadea0c58ff975b1
        env:
          POSTGRES_PASSWORD: flowdeck
          POSTGRES_DB: flowdeck_test
        ports:
          - 5432:5432
        # Without this the job races the database's startup and fails on the
        # first connection rather than on anything FlowDeck did.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads global.json rather than hard-coding a version, so the SDK CI uses
      # is the SDK the repository pins. Two places naming a version is two
      # places to disagree.
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore FlowDeck.slnx

      - name: Build
        run: dotnet build FlowDeck.slnx --no-restore --configuration Release

      # Warnings are errors in CI so that lint debt cannot accumulate silently.
      - name: Verify formatting
        run: dotnet format FlowDeck.slnx --verify-no-changes --severity warn

      - name: Test
        env:
          # Turns the skipped Postgres conformance subclass into a running one.
          # Absent locally, so the default `dotnet test` stays fast and needs
          # no database (#78).
          FLOWDECK_POSTGRES: Host=localhost;Database=flowdeck_test;Username=postgres;Password=flowdeck
        run: >-
          dotnet test FlowDeck.slnx --no-build --configuration Release
          --logger trx --results-directory artifacts/test-results
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-results
          path: artifacts/test-results
          if-no-files-found: ignore
          retention-days: 14

  # -------------------------------------------------------------- frontend
  frontend:
    name: Frontend (Angular 22)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Lint
        working-directory: src/frontend
        run: npm run lint

      # Angular 22 runs tests on Vitest in jsdom, not Karma in a browser, so
      # there is nothing to launch and no --browsers flag. This was written
      # against Karma in Phase 2, before the frontend existed; corrected when
      # it did.
      - name: Test
        working-directory: src/frontend
        run: npm run test -- --watch=false

      - name: Build
        working-directory: src/frontend
        run: npm run build -- --configuration production

  # -------------------------------------------------------------- security
  # GitHub-side secret scanning and push protection already cover this repo.
  # This job is defence in depth: it catches a secret in a PR branch before
  # review, and covers pattern classes gitleaks knows that GitHub does not.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: '8.30.1'
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Installed here rather than assumed present. The previous version of
      # this step errored out telling the operator to `scoop install gitleaks`
      # - advice that only made sense on the Windows self-hosted runner it was
      # written for, and that nobody was ever going to see because the job had
      # never run.
      #
      # The checksum is fetched from the same release as the binary, so it
      # verifies the download arrived intact - not that the release is
      # authentic. Proportionate: gitleaks is defence in depth behind GitHub's
      # own secret scanning, not the only thing standing between a secret and
      # the repository.
      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail

          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"

          curl --fail --silent --show-error --location -o "$archive" "$base/$archive"
          curl --fail --silent --show-error --location -o checksums.txt \
            "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"

          grep " $archive\$" checksums.txt | sha256sum --check --status

          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

          gitleaks version

      - name: Scan with gitleaks
        shell: bash
        run: gitleaks git --redact --no-banner --verbose

  # ------------------------------------------------------------------ gate
  # Single required status check. Branch rulesets can point at this one job
  # instead of being updated every time a matrix leg is added or renamed.
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [backend, frontend, secrets]
    if: always()
    steps:
      - name: Fail if any upstream job did not succeed
        shell: bash
        run: |
          echo "backend:  ${{ needs.backend.result }}"
          echo "frontend: ${{ needs.frontend.result }}"
          echo "secrets:  ${{ needs.secrets.result }}"
          if [ "${{ needs.backend.result }}"  != "success" ] || \
             [ "${{ needs.frontend.result }}" != "success" ] || \
             [ "${{ needs.secrets.result }}"  != "success" ]; then
            echo "::error::One or more CI jobs failed."
            exit 1
          fi
